name: ✨ Feature request
description: A new entity, field, filter, download file, website feature or other improvement.
labels: [enhancement, triage]
body:
  - type: textarea
    id: need
    attributes:
      label: What are you trying to do?
      description: Describe the task or question, not just the solution.
    validations: { required: true }
  - type: textarea
    id: proposal
    attributes: { label: "What would help?" }
  - type: textarea
    id: workaround
    attributes: { label: "How do you work around it today?" }
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [API, Website, Download files, Not sure]
