name: 📘 Documentation
description: Something in the API Reference or other website text that is unclear, missing or wrong.
labels: [docs, triage]
body:
  - type: input
    id: page
    attributes:
      label: Page or document
      placeholder: API Reference (v5) → Grants, or another website page
    validations: { required: true }
  - type: textarea
    id: issue
    attributes: { label: "What's wrong or missing?" }
    validations: { required: true }
